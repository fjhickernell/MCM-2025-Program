name: Build MCM 2025 Program Book (Robust)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run daily at 2 AM UTC (similar to your local daily build)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v2
      with:
        environment-file: environment.yml
        activate-environment: mcm2025
        python-version: 3.10
        channels: conda-forge,defaults
        channel-priority: flexible
        auto-activate-base: false
        miniforge-variant: Mambaforge
        use-mamba: true
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-science \
          texlive-pictures \
          pdftk-java \
          ghostscript \
          build-essential \
          curl \
          wget
          
    - name: Configure TeXLive
      run: |
        sudo tlmgr update --self --all || true
        echo "TeXLive version:"
        tex --version
        
    - name: Verify conda environment
      shell: bash -l {0}
      run: |
        conda activate mcm2025
        echo "Python version:"
        python --version
        echo "Installed packages:"
        conda list
        echo "Current directory:"
        pwd
        echo "Directory contents:"
        ls -la
        
    - name: Check makefile targets
      run: |
        echo "Available make targets:"
        make -n pp || echo "pp target check failed"
        make -n pgm || echo "pgm target check failed"
        
    - name: Run preprocessing with error handling
      shell: bash -l {0}
      run: |
        conda activate mcm2025
        echo "Starting preprocessing..."
        set -e  # Exit on error
        make clean_pp || echo "clean_pp failed, continuing..."
        make pp
        echo "Preprocessing completed successfully"
        
    - name: Check preprocessing outputs
      run: |
        echo "Checking preprocessing outputs:"
        ls -la preprocess/out/ || echo "No preprocess/out directory"
        ls -la preprocess/interim/ || echo "No preprocess/interim directory"
        
    - name: Run program generation with error handling
      shell: bash -l {0}
      run: |
        conda activate mcm2025
        echo "Starting program generation..."
        set -e  # Exit on error
        make pgm
        echo "Program generation completed successfully"
        
    - name: Check final outputs
      run: |
        echo "Final outputs:"
        ls -la MCM_ProgramBook_TEX/ || echo "No MCM_ProgramBook_TEX directory"
        echo "PDF files:"
        find . -name "*.pdf" -type f -exec ls -lh {} \; | head -10
        
    - name: Upload program book artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mcm-2025-program-book-${{ github.run_number }}
        path: |
          MCM_ProgramBook_TEX/*.pdf
          MCM_ProgramBook_TEX/MCM2025_*.pdf
          preprocess/out/*.tex
          preprocess/out/*.csv
        retention-days: 30
        
    - name: Upload intermediate files for debugging
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: debug-files-${{ github.run_number }}
        path: |
          preprocess/interim/
          preprocess/out/
          MCM_ProgramBook_TEX/*.log
          MCM_ProgramBook_TEX/*.aux
          daily_build.log
          build_programbook.log
        retention-days: 7
        
    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          MCM_ProgramBook_TEX/MCM2025_Book.pdf
          MCM_ProgramBook_TEX/MCM2025_schedule.pdf
          MCM_ProgramBook_TEX/MCM2025_schedule1sheet.pdf
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
